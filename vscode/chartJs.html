<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade: Chart.js
  </title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="display: flex;">
  
  <!-- "tela em branco" na qual o gráfico aparecerá-->
  <div>
    <canvas id="myChart" style="position: relative; height:45vh; width:45vw"></canvas>
  </div>
  
  <div>
      <canvas id="myChart2" style="position: relative; height:45vh; width:45vw"></canvas>
  </div>


  <!-- SETUP - preparação para o código-->
  <script>

    //vetor
    //dimensões do gráfico
    const labels = [
      '12:00',
      '13:00',
      '14:00',
      '15:00',
      '16:00',
      '17:00',
    ];

    const labels2 = [
      'Janeiro',
      'Fevereiro',
      'Março',
      'Abril',
      'Maio',
      'Junho',
    ];

    //vetor e jason
    //métricas
    const data = {
      labels: labels,
      datasets: [{
        label: 'Temperatura',
        backgroundColor: 'rgb(255, 99, 132)',
        borderColor: 'rgb(255, 99, 132)',
        data: [30, 29, 28, 25, 22, 23],
      },
      {
        label: 'Umidade',
        backgroundColor: 'rgb(0, 0, 255)',
        borderColor: 'rgb(0, 0, 255)',
        data: [80, 82, 80, 85, 80, 83],
      }]
    };

    const data2 = {
      labels: labels2,
      datasets: [{
        label: 'Temperatura',
        backgroundColor: 'rgb(255, 99, 132)',
        borderColor: 'rgb(255, 99, 132)',
        data: [22, 24, 27, 23, 20, 18],
      },
      {
        label: 'Umidade',
        backgroundColor: 'rgb(0, 0, 255)',
        borderColor: 'rgb(0, 0, 255)',
        data: [90, 89, 93, 87, 88, 82],
      }]
    };
    
    const config = {
      type: 'line',
      data: data,
      options: {}
    };

    const config2 = {
      type: 'bar',
      data: data2,
      options: {}
    };

    </script>

  <!-- coloca as configurações no gráfico -->
  <script>
    const myChart = new Chart(
      document.getElementById('myChart'),
      config
    );
    </script>

    <script>
      const myChart2 = new Chart(
        document.getElementById('myChart2'),
        config2
      );
    </script>
</body>

</html>
